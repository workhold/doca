name: SDD

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test SDD records and isolated tooling
        run: pnpm test:sdd
      - name: Check specifications and pinned tooling
        run: pnpm sdd:check
      - name: Check PR classification and traceability
        if: github.event_name == 'pull_request'
        run: pnpm sdd:check --pr-event "$GITHUB_EVENT_PATH"
