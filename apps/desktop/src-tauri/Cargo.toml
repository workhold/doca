[package]
name = "doca-desktop"
version = "0.2.40"
description = "Doca desktop client"
authors = ["Doca"]
edition = "2021"

[lib]
name = "doca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.4.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = { version = "=2.3.0", features = ["deep-link"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["net", "sync", "time", "fs", "macros"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
dirs = "7"
base64 = "0.22"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"], default-features = false }
open = "5"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

